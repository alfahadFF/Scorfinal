name: Fix mobile menu id
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -rl 'id="mobileالقائمة"' --include='*.html' . | xargs -r sed -i 's/id="mobileالقائمة"/id="mobileMenu"/g'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fix mobile menu id"
          git push
