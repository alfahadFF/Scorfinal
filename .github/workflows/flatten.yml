name: Flatten SCOR site to root
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move scor1 contents to root, delete everything else
        run: |
          set -e
          shopt -s dotglob nullglob
          for item in *; do
            case "$item" in
              .git|.github|scor1) ;;
              *) rm -rf -- "$item" ;;
            esac
          done
          for item in scor1/*; do mv -- "$item" .; done
          rmdir scor1
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Move SCOR site to repository root"
          git push
